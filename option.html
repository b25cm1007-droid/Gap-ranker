<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Selection</title>
  <link rel="stylesheet" href="option.css">
</head>
<body>
  <h1>Select Your Quiz Category</h1>
  <div class="options">
    <!-- Computer Languages -->
    <div class="card" onclick="startQuiz('languages')">
      <h2>Computer Languages</h2>
      <p>Test your knowledge of C, Java, Python, etc.</p>
    </div>

    <!-- DSA goes directly to Bing link -->

      <h2>DSA</h2>
      <p>Click here to explore DSA questions on Bing.</p>
    </a>

    <!-- Semester Questions -->
    <div class="card" onclick="startQuiz('semester')">
      <h2>Semester Questions</h2>
      <p>Prepare for your exams with semester quizzes.</p>
    </div>
  </div>

  <div id="quizContainer" class="hidden">
    <h2 id="quizTitle"></h2>
    <div id="questions"></div>
  </div>

  <script src="option.js"></script>
</body>
</html>
